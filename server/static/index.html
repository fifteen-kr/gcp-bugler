<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="referrer" content="no-referrer" />
        <title>GCP Control Panel</title>
<style>
body {
    font-family: sans-serif;
    background-color: #FAFAFA;
    text-align: center;
}

table.gcp-status-list {
    margin: 0 auto;
    border-collapse: collapse;

    th, td {
        padding: 0.5em;
        border: 1px solid #CCC;
    }
    th {
        background-color: #EEE;
        font-weight: bold;
    }
    td {
        text-align: center;
    }
    button {
        margin: 0 0.1em;
        padding: 0.5em;
        border: 1px solid #CCC;
        background-color: #DDF;
        cursor: pointer;

        &:hover {
            background-color: #EEF;
        }

        &.btn-danger {
            background-color: #FDD;
            &:hover {
                background-color: #FEE;
            }
        }
    }
}
</style>
    </head>
    <body>
        <h1>GCP Control Panel</h1>
        <table class="gcp-status-list">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Status</th>
                    <th>Last Started At</th>
                    <th>Expire At</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="gcp-status-list-body"></tbody>
        </table>
        <p id="status">Initializing...</p>
<script>
//@ts-check

/** @param {number} date */
function timestampToString(date) {
    return new Date(date).toLocaleString();
}

/**
 * @param {string} status
 * @param {string} action
 * @returns {boolean}
 */
function shouldShowButton(status, action) {
    switch(action) {
        case 'start': return status === 'TERMINATED' || status === 'SUSPENDED';
        case 'keep-alive':
        case 'persist':
        case 'stop': return status === 'STAGING' || status === 'RUNNING';
        default: return true;
    }
}

/** @param {string} status */
function setStatus(status) {
    const p_elem = document.getElementById('status');
    if(p_elem) p_elem.textContent = status;
}

async function updateStatus() {
    setStatus("Updating...");

    /** @type {{servers: Array<{id: string; name?: string; status?: string; last_start?: number|null, last_stop?: number|null, expire_time: number|null;}>}} */
    const status = await (await fetch("./status")).json();
    const rows = status.servers.map(({id: server_id, name: server_name, status, last_start, last_stop, expire_time}) => {
        const elem_row = document.createElement('tr');

        const elem_name = document.createElement('td');
        elem_name.textContent = server_name ?? server_id;
        elem_row.appendChild(elem_name);

        const elem_status = document.createElement('td');
        elem_status.textContent = status ?? "Unknown";
        elem_row.appendChild(elem_status);

        const elem_start_time = document.createElement('td');
        elem_start_time.textContent = last_start != null ? timestampToString(last_start) : "None";
        elem_row.appendChild(elem_start_time);

        const elem_expire_time = document.createElement('td');
        elem_expire_time.textContent = expire_time != null ? timestampToString(expire_time) : "None";
        elem_row.appendChild(elem_expire_time);

        const elem_action = document.createElement('td');

        for(const [action, btn_text] of [
            ['start', 'Start'],
            ['keep-alive', 'Keep Using'],
            ['persist', 'Persist'],
            ['stop', 'Stop'],
        ]) {
            if(status && !shouldShowButton(status, action)) continue;
            if(expire_time == null && (action === 'keep-alive' || action === 'persist')) continue;

            const btn = document.createElement('button');
            btn.textContent = btn_text;

            if(action === 'stop') {
                btn.classList.add('btn-danger');
            }

            btn.addEventListener('click', async () => {
                if(!confirm(`Do you want to ${action} the server "${server_name ?? server_id}"?`)) return;

                try {
                    await fetch(`./${action}/${server_id}`, {method: 'POST'});
                } catch(err) {
                    alert("An error has been occurred!");
                    return;
                }

                void updateStatus();
            });
            elem_action.appendChild(btn);
        }

        elem_row.appendChild(elem_action);

        return elem_row;
    });

    document.getElementById('gcp-status-list-body')?.replaceChildren(...rows);
    setStatus("");
}

async function main() {
    void updateStatus();
}

main().catch((err) => console.error(err));
</script>
    </body>
</html>
